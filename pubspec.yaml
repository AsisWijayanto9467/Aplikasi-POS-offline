name: salon_desk
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0-323.0.dev

dependencies:
  flutter:
    sdk: flutter

  flutter_blue_plus: ^1.32.5    # Print via Bluetooth (aktif dan terawat)
  esc_pos_utils: ^1.1.0 
  permission_handler: ^11.0.1  # Izin Bluetooth

  # ========== DATABASE ==========
  sqflite: ^2.3.3              # Database SQLite (Offline)
  path: ^1.9.0                 # Path management
  
  # ========== STATE MANAGEMENT ==========
  provider: ^6.1.2             # State management (simple & recommended)
  
  # ========== UI & THEME ==========
  google_fonts: ^6.2.1         # Font Poppins & Inter
  
  # ========== ICONS ==========
  phosphor_flutter: ^2.1.0     # Icon modern outline (Phosphor Icons)
  
  # ========== CHARTS ==========
  fl_chart: ^0.69.0            # Grafik laporan (line, bar, pie)
  
  # ========== IMAGE PICKER ==========
  image_picker: ^1.1.2         # Ambil gambar produk/jasa dari galeri/kamera
  
  # ========== QR CODE ==========
  qr_flutter: ^4.1.0           # Generate QR Code untuk pembayaran QRIS
  
  # ========== LOADING & ANIMATION ==========
  shimmer: ^3.0.0              # Loading shimmer effect
  lottie: ^3.1.2               # Animasi success, empty state
  
  # ========== FORMATTING ==========
  intl: ^0.19.0                # Format currency (Rp), date, number
  
  # ========== FILE STORAGE ==========
  path_provider: ^2.1.4        # Path penyimpanan file (gambar)
  
  # ========== PRINTING (STRUK) ==========
         # Generate data untuk print struk thermal
  # esc_pos_bluetooth: ^1.1.0  # Print via Bluetooth (uncomment kalau perlu)
  
  # ========== UI COMPONENTS ==========
  flutter_slidable: ^3.1.1     # Swipe action di list (edit/delete)
  cached_network_image: ^3.4.0 # Cache gambar (kalau nanti pakai network)
  excel: ^4.0.4                      # Export Excel
  syncfusion_flutter_pdf: ^25.1.35   # PDF (alternatif, tidak konflik)
  url_launcher: ^6.2.5                  # Buka file
  share_plus: ^9.0.0                 # Share file
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_foreground.png"  # Ganti ke foreground only
  adaptive_icon_background: "#7E0092"                # Background ungu dari kode
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  adaptive_icon_inset: 25                            # Sesuaikan: 12-20
  remove_alpha_ios: true            

flutter:
  uses-material-design: true
